<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="汽车发动机、底盘、电气试题库在线练习：一页多题、整页翻页、答题卡分页，自动判分与错题导出。">
<title>汽车发动机、底盘、电气试题库 · 在线测试</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
    --primary:#2563eb; --primary-weak:#dbeafe; --ok:#16a34a; --ok-bg:#dcfce7;
    --bad:#dc2626; --bad-bg:#fee2e2; --chip:#eef2ff; --chip-text:#3730a3;
    --radius:14px; --shadow:0 6px 20px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --card:#111a2e; --text:#e5e7eb; --muted:#94a3b8; --border:#1f2a44;
      --primary:#3b82f6; --primary-weak:#1c2f5c; --ok:#4ade80; --ok-bg:#11321f;
      --bad:#f87171; --bad-bg:#3a1618; --chip:#1e2a4a; --chip-text:#c7d2fe;
      --shadow:0 6px 20px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  [hidden]{display:none!important}
  header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:18px 20px}
  header h1{margin:0;font-size:20px;line-height:1.5}
  header p{margin:6px 0 0;opacity:.9;font-size:13px;line-height:1.6}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
  h2{font-size:15px;margin:0 0 10px}
  h3{font-size:15px;margin:0 0 12px}
  .btn{border:1px solid var(--border);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--text);min-height:38px}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn:focus-visible, #answerCard button:focus-visible, .option:focus-within{outline:2px solid var(--primary);outline-offset:2px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}
  .stats{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:14px;align-items:center}
  .stats b{color:var(--text)}
  .small{color:var(--muted);font-size:13px;line-height:1.6}
  .question-title{font-size:17px;line-height:1.8;margin:8px 0 16px;white-space:pre-wrap;overflow-wrap:anywhere}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--chip-text);margin-right:6px}
  .tag.multi{background:#fef3c7;color:#92400e}
  .tag.judge{background:#dcfce7;color:#166534}
  .option{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin:8px 0;cursor:pointer;transition:.15s;line-height:1.6;background:var(--card)}
  .option:hover{border-color:#93c5fd;background:var(--primary-weak)}
  .option.selected{border-color:var(--primary);background:var(--primary-weak)}
  .option.correct{border-color:var(--ok);background:var(--ok-bg)}
  .option.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .option input{margin:3px 0 0;flex:none;accent-color:var(--primary)}
  .option .txt{flex:1;overflow-wrap:anywhere}
  .option .mark{flex:none;font-weight:700;min-width:1.2em;text-align:right}
  .option .mark.ok{color:var(--ok)}
  .option .mark.bad{color:var(--bad)}
  #questionList{display:flex;flex-direction:column;gap:16px}
  .qcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);scroll-margin-top:12px}
  .qcard.flash{outline:3px solid var(--primary);outline-offset:2px}
  .qhead{margin-bottom:4px}
  .qfeedback{margin-top:12px;font-size:14px;line-height:1.8}
  .verdict{font-weight:700}
  .verdict.ok{color:var(--ok)}
  .verdict.bad{color:var(--bad)}
  .pager,.cpager{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px 0}
  .pager-info{min-width:130px;text-align:center}
  #answerCard{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;max-height:320px;overflow:auto;padding:4px}
  #answerCard button{height:40px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px}
  #answerCard button.answered{background:var(--primary-weak);border-color:#93c5fd}
  #answerCard button.correct{background:var(--ok-bg);border-color:var(--ok)}
  #answerCard button.wrong{background:var(--bad-bg);border-color:var(--bad)}
  .progress{height:8px;background:var(--border);border-radius:999px;overflow:hidden}
  .progress>div{height:100%;width:0;background:var(--primary);transition:width .15s}
  .status{padding:12px 14px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;margin-top:12px;line-height:1.7;overflow-wrap:anywhere}
  .status.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 24px}
  .dlg{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text);max-width:420px;width:calc(100% - 32px);padding:20px;box-shadow:var(--shadow)}
  .dlg::backdrop{background:rgba(15,23,42,.45)}
  @media (prefers-color-scheme: dark){
    .tag.multi{background:#3f2d0c;color:#fcd34d}
    .tag.judge{background:#0f3d2a;color:#86efac}
    .status{background:#12203a;border-color:#1e3a8a;color:#bfdbfe}
    .status.error{background:#3a1618;border-color:#7f1d1d;color:#fecaca}
  }
  @media (max-width:600px){
    main{padding:10px}.card,.qcard{padding:12px}.question-title{font-size:16px}
    .toolbar .btn{padding:8px 10px}#answerCard{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}
  }
</style>
</head>
<body>
<header>
  <h1>汽车发动机、底盘、电气试题库 · 在线测试</h1>
  <p>一页多题、整页翻页，答题卡分页快速跳题；自动判分、错题复习与导出。答题记录仅保存在本机浏览器。</p>
</header>
<main>
  <section class="card" aria-labelledby="bankTitle">
    <div class="flex">
      <h2 id="bankTitle" style="margin:0">题库状态</h2>
      <span class="spacer"></span>
      <button class="btn" type="button" id="reloadBankBtn">重新加载题库</button>
    </div>
    <div id="loadInfo" class="status" role="status" aria-live="polite">正在连接在线题库……</div>
    <p class="small">答题记录只保存在当前浏览器的 localStorage，不会上传服务器；更换浏览器或清理站点数据后不会保留。</p>
  </section>

  <div id="quizPanel" hidden>
    <section class="card" aria-label="练习控制台">
      <div class="toolbar">
        <button class="btn primary" type="button" id="startBtn">开始 / 重新开始</button>
        <select id="modeSelect" class="btn" aria-label="练习模式">
          <option value="all">全部题顺序练习</option>
          <option value="random">全部题随机练习</option>
          <option value="wrong">只练错题</option>
          <option value="unanswered">只练未答题</option>
        </select>
        <select id="pageSizeSelect" class="btn" aria-label="每页题数">
          <option value="5">每页 5 题</option>
          <option value="10" selected>每页 10 题</option>
          <option value="20">每页 20 题</option>
          <option value="50">每页 50 题</option>
        </select>
        <button class="btn" type="button" id="submitBtn">提交判分</button>
        <button class="btn" type="button" id="resetBtn">清空答案</button>
        <button class="btn" type="button" id="toggleCardBtn" aria-expanded="false" aria-controls="cardPanel">答题卡</button>
      </div>
      <div class="progress" id="progressWrap" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="margin-top:12px">
        <div id="progressBar"></div>
      </div>
      <div class="stats" style="margin-top:10px">
        <span>本次题数：<b id="totalCount">0</b></span>
        <span>已答：<b id="answeredCount">0</b></span>
        <span>正确：<b id="correctCount">0</b></span>
        <span>错误：<b id="wrongCount">0</b></span>
        <span>正确率：<b id="accuracy">0%</b></span>
        <span class="spacer"></span>
        <span class="small" id="progressText"></span>
      </div>
      <div class="pager" style="padding-bottom:0">
        <button class="btn" type="button" data-nav="prev">上一页</button>
        <span class="small pager-info"></span>
        <button class="btn primary" type="button" data-nav="next">下一页</button>
      </div>
    </section>

    <div id="questionList"></div>

    <div class="pager">
      <button class="btn" type="button" data-nav="prev">上一页</button>
      <span class="small pager-info"></span>
      <button class="btn primary" type="button" data-nav="next">下一页</button>
    </div>

    <section class="card" id="cardPanel" hidden aria-label="答题卡">
      <div class="flex">
        <h3 style="margin:0">答题卡</h3>
        <span class="spacer"></span>
        <span class="small" id="cardRange"></span>
      </div>
      <div id="answerCard" style="margin-top:12px"></div>
      <div class="cpager">
        <button class="btn" type="button" id="cardPrev">上一页</button>
        <button class="btn" type="button" id="cardNext">下一页</button>
      </div>
    </section>

    <section class="card" id="resultPanel" hidden aria-label="测试结果">
      <h3>测试结果</h3>
      <div id="resultBox" class="small" style="font-size:15px;line-height:1.8" aria-live="polite"></div>
      <div class="flex" style="margin-top:12px">
        <button class="btn primary" type="button" id="reviewWrongBtn">查看错题</button>
        <button class="btn" type="button" id="exportWrongBtn">导出错题 CSV</button>
      </div>
    </section>
  </div>
</main>
<footer>汽车专业在线练习 · 本地保存答题记录</footer>

<dialog id="confirmDlg" class="dlg" aria-labelledby="confirmText">
  <form method="dialog">
    <p id="confirmText" style="margin:0 0 16px;line-height:1.7"></p>
    <div class="flex" style="justify-content:flex-end">
      <button class="btn" type="submit" value="cancel">取消</button>
      <button class="btn primary" type="submit" value="ok">确定</button>
    </div>
  </form>
</dialog>

<noscript><p style="text-align:center;color:#dc2626">需要启用 JavaScript 才能使用在线练习。</p></noscript>

<script>
(function () {
  'use strict';

  /* ========================= 配置 ========================= */
  // 按顺序尝试，第一个能取到的就用它
  const BANK_URLS = ['./题库.xls', './题库.xlsx'];
  // 按顺序尝试：本地副本 → SheetJS 官方 CDN → jsDelivr 旧版兜底
  const XLSX_SOURCES = [
    './xlsx.full.min.js',
    'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx.full.min.js',
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'
  ];
  const STORAGE_KEY = 'autoQuizAnswers_v3';
  const LEGACY_KEY = 'autoQuizAnswers_v2';
  const CARD_SIZE = 50;          // 答题卡每页题号数量

  const LETTER = i => String.fromCharCode(65 + i);

  /* ========================= 状态 ========================= */
  const state = {
    all: [],          // 全部题目
    questions: [],    // 当前练习的题目
    answers: {},      // id -> 选项下标数组
    keys: {},         // id -> 答案排序后字符串（判题缓存，避免反复排序）
    page: 0,          // 当前题目页（0 开始）
    pageSize: 10,     // 每页题目数
    cardPage: 0,      // 答题卡当前页
    submitted: false,
    cardEls: []       // 当前答题卡页的按钮
  };
  let legacyAnswers = null;   // v2 旧记录，用于迁移
  let xlsxPromise = null;

  /* ========================= 小工具 ========================= */
  const $ = id => document.getElementById(id);
  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };

  function cellText(v) {
    return String(v == null ? '' : v)
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/\u00a0/g, ' ')
      .trim();
  }
  function normKey(s) {
    return String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
  }
  function keyOf(ans) {
    return [...ans].sort((a, b) => a - b).join(',');
  }
  function hashStr(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(36);
  }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }
  function pageCount() {
    return Math.max(1, Math.ceil(state.questions.length / state.pageSize));
  }
  function cardPageCount() {
    return Math.max(1, Math.ceil(state.questions.length / CARD_SIZE));
  }

  /* ========================= 答案解析 ========================= */
  const JUDGE_YES = /^(对|正确|√|✓|是|t|true|y|yes)$/i;
  const JUDGE_NO  = /^(错|错误|×|✗|否|f|false|n|no)$/i;

  // 判断题判定：题型=2，或两个选项正好是"对/错""正确/错误"（顺序不限）
  function detectJudge(itemType, options) {
    if (itemType === 2) return true;
    if (options.length !== 2) return false;
    const a = options[0].trim();
    const b = options[1].trim();
    return (JUDGE_YES.test(a) && JUDGE_NO.test(b)) || (JUDGE_NO.test(a) && JUDGE_YES.test(b));
  }

  // 返回答案对应的选项下标数组；支持 1/2/3、A/B/C、12、A,B、A|B、123 等写法
  function parseRightAnswer(raw, isJudge, options) {
    const s = cellText(raw).replace(/\s+/g, ' ').trim();
    if (!s) return [];
    const tokens = s.split(/[|,，、;；\/\s]+/).filter(Boolean);
    if (!tokens.length) return [];

    if (isJudge) {
      const yesIdx = options.findIndex(o => JUDGE_YES.test(o.trim()));
      const noIdx = options.findIndex(o => JUDGE_NO.test(o.trim()));
      const out = [];
      tokens.forEach(tok => {
        const t = tok.replace(/[（）()]/g, '');
        let idx = -1;
        if (/^[12]$/.test(t)) idx = Number(t) - 1;
        else if (JUDGE_YES.test(t)) idx = yesIdx >= 0 ? yesIdx : 0;
        else if (JUDGE_NO.test(t)) idx = noIdx >= 0 ? noIdx : 1;
        else if (/^[A-Fa-f]$/.test(t)) idx = t.toUpperCase().charCodeAt(0) - 65;
        if (idx >= 0 && idx < options.length) out.push(idx);
      });
      return [...new Set(out)];
    }

    const out = [];
    tokens.forEach(tok => {
      const t = tok.replace(/[（）()【】\[\]]/g, '');
      if (/^[A-Fa-f]+$/.test(t)) {
        t.toUpperCase().split('').forEach(c => out.push(c.charCodeAt(0) - 65));
      } else if (/^[1-6]+$/.test(t)) {
        t.split('').forEach(c => out.push(Number(c) - 1));
      } else if (/^\d+$/.test(t)) {
        out.push(Number(t) - 1);
      }
    });
    return [...new Set(out.filter(n => Number.isInteger(n) && n >= 0 && n < options.length))];
  }

  /* ========================= 表格解析 ========================= */
  const OPTION_ALIASES = [
    ['option1', '选项1', '选项a', 'a选项'],
    ['option2', '选项2', '选项b', 'b选项'],
    ['option3', '选项3', '选项c', 'c选项'],
    ['option4', '选项4', '选项d', 'd选项'],
    ['option5', '选项5', '选项e', 'e选项'],
    ['option6', '选项6', '选项f', 'f选项']
  ];
  const HEADER_KEYS = ['itemtitle', '题干', '题目内容', '题目编号', 'code', '题号', '题型'];

  function col(map, names) {
    for (const n of names) {
      const k = normKey(n);
      if (map.has(k)) return map.get(k);
    }
    return -1;
  }
  function findTitleCol(map) {
    const idx = col(map, ['itemtitle', '题干', '题目内容', '题目', '试题', '题目描述']);
    if (idx >= 0) return idx;
    for (const [k, v] of map) {
      if (k.indexOf('题干') === 0 || k.indexOf('itemtitle') === 0) return v;
    }
    return -1;
  }
  function findHeader(rows) {
    const limit = Math.min(rows.length, 30);
    for (let i = 0; i < limit; i++) {
      const lower = (rows[i] || []).map(v => normKey(cellText(v)));
      const hit = lower.some(v => HEADER_KEYS.indexOf(v) >= 0 || v.indexOf('题干') === 0);
      if (hit) {
        const map = new Map();
        lower.forEach((v, j) => { if (v && !map.has(v)) map.set(v, j); });
        return { rowIndex: i, map };
      }
    }
    return null;
  }

  function parseWorkbook(wb) {
    const all = [];
    const seen = new Set();
    const stats = { noTitle: 0, noOptions: 0, noAnswer: 0, duplicates: 0 };

    wb.SheetNames.forEach(sheetName => {
      const ws = wb.Sheets[sheetName];
      if (!ws) return;

      let rows;
      try {
        rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
      } catch (e) {
        console.warn('工作表读取失败：', sheetName, e);
        return;
      }
      if (!rows || !rows.length) return;

      const header = findHeader(rows);
      const start = header ? header.rowIndex + 1 : 0;
      const map = header ? header.map : null;
      const titleCol = map ? findTitleCol(map) : -1;

      for (let r = start; r < rows.length; r++) {
        const row = rows[r] || [];
        let title = '', options = [], rightRaw = '', itemType = 0;
        let code = '', ipcode = '', knowledge = '';

        if (map) {
          code = cellText(row[col(map, ['code', '题目编号', '题号', '编号'])]);
          ipcode = cellText(row[col(map, ['ipcode', '题库编号'])]);
          itemType = Number(cellText(row[col(map, ['itemtype', '题目类型', '题型', '类型'])])) || 0;
          knowledge = cellText(row[col(map, ['knowledgepoints', '知识点编号', '知识点', '考点'])]);
          rightRaw = cellText(row[col(map, ['rightanswer', '正确答案', '答案', '标准答案'])]);
          title = cellText(titleCol >= 0 ? row[titleCol] : '');

          const optCols = OPTION_ALIASES.map(alias => col(map, alias));
          if (optCols.some(i => i >= 0)) {
            options = optCols.map(i => (i >= 0 ? cellText(row[i]) : ''));
          } else {
            // 表头用 A/B/C/D 单字母表示选项列的情况
            options = ['a', 'b', 'c', 'd', 'e', 'f'].map(ch => {
              const i = col(map, [ch]);
              return i >= 0 ? cellText(row[i]) : '';
            });
          }
        } else {
          // 兼容无表头的老格式：D=题型、F=题干、H-M=选项、N=答案、O=知识点
          title = cellText(row[5]);
          itemType = Number(cellText(row[3])) || 0;
          ipcode = cellText(row[1]);
          for (let j = 7; j <= 12; j++) options.push(cellText(row[j]));
          rightRaw = cellText(row[13]);
          if (!rightRaw) {
            for (let j = row.length - 1; j >= 0; j--) {
              const v = cellText(row[j]);
              if (/^[1-6](?:[|,，、][1-6])*$/.test(v)) { rightRaw = v; break; }
            }
          }
          knowledge = cellText(row[14]);
        }

        // 去掉尾部空选项；中间空位保留，保证选项序号和答案序号始终对应
        while (options.length && !options[options.length - 1]) options.pop();

        if (!title) { stats.noTitle++; continue; }
        if (/^(题干|itemtitle)$/i.test(title)) { stats.noTitle++; continue; }
        if (options.length < 2) { stats.noOptions++; continue; }

        const judge = detectJudge(itemType, options);
        const right = parseRightAnswer(rightRaw, judge, options);
        if (!right.length) { stats.noAnswer++; continue; }

        // 用题干+选项的内容哈希做 id：Excel 增删行、改题号都不会让答题记录失效
        const id = 'q' + hashStr(title + '\u0001' + options.join('\u0002'));
        if (seen.has(id)) { stats.duplicates++; continue; }
        seen.add(id);

        all.push({
          id,
          code,
          ipcode,
          itemType,
          isJudge: judge,
          isMultiple: !judge && (itemType === 1 || right.length > 1),
          title,
          options,
          right,
          rightKey: keyOf(right),
          knowledge,
          sheet: sheetName,
          loc: sheetName + ' 第 ' + (r + 1) + ' 行'
        });
      }
    });

    return { questions: all, stats };
  }

  function statsSummary(stats) {
    const parts = [];
    if (stats.noTitle) parts.push('无题干 ' + stats.noTitle + ' 行');
    if (stats.noOptions) parts.push('选项不足 2 个 ' + stats.noOptions + ' 行');
    if (stats.noAnswer) parts.push('答案无法识别 ' + stats.noAnswer + ' 行');
    if (stats.duplicates) parts.push('重复题目 ' + stats.duplicates + ' 行');
    return parts.length ? '；已跳过：' + parts.join('，') : '';
  }

  /* ========================= 本地存储 ========================= */
  function saveAnswers() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        v: 3,
        answers: state.answers,
        savedAt: new Date().toISOString()
      }));
    } catch (e) {
      console.warn('本地保存失败：', e);
    }
  }

  function loadSaved() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      const src = raw && raw.answers && typeof raw.answers === 'object' ? raw.answers : null;
      if (src) {
        Object.keys(src).forEach(id => {
          const a = src[id];
          if (Array.isArray(a) && a.length && a.every(n => Number.isInteger(n) && n >= 0)) {
            state.answers[id] = [...new Set(a)].sort((x, y) => x - y);
            state.keys[id] = keyOf(state.answers[id]);
          }
        });
      }
    } catch (e) {
      state.answers = {};
      state.keys = {};
    }
    try {
      const old = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
      legacyAnswers = old && old.answers && typeof old.answers === 'object' ? old.answers : null;
    } catch (e) {
      legacyAnswers = null;
    }
  }

  // 把旧版（按题号存储）的答案迁移到新 id 上，避免升级后记录全丢
  function migrateLegacy(questions) {
    if (!legacyAnswers) return;
    let migrated = 0;
    questions.forEach(q => {
      if (state.keys[q.id] !== undefined || !q.code) return;
      const old = legacyAnswers[q.code];
      if (!Array.isArray(old) || !old.length) return;
      const ans = old.filter(n => Number.isInteger(n) && n >= 0 && n < q.options.length);
      if (!ans.length) return;
      state.answers[q.id] = [...new Set(ans)].sort((a, b) => a - b);
      state.keys[q.id] = keyOf(state.answers[q.id]);
      migrated++;
    });
    if (migrated) console.info('已从旧版本记录中恢复 ' + migrated + ' 道题的答案。');
  }

  function revalidateAnswers() {
    const byId = new Map(state.all.map(q => [q.id, q]));
    Object.keys(state.answers).forEach(id => {
      const q = byId.get(id);
      if (!q) return;                       // 题库里暂时没有这道题：保留，等它回来
      const ans = state.answers[id].filter(n => n < q.options.length);
      if (ans.length) {
        state.answers[id] = ans;
        state.keys[id] = keyOf(ans);
      } else {
        delete state.answers[id];
        delete state.keys[id];
      }
    });
  }

  /* ========================= 状态查询 ========================= */
  function statusOf(q) {
    const k = state.keys[q.id];
    if (k === undefined) return 0;
    return k === q.rightKey ? 1 : -1;
  }

  /* ========================= 题目渲染 ========================= */
  function buildQuestion(q, idx) {
    const art = document.createElement('article');
    art.className = 'qcard';
    art.dataset.idx = String(idx);

    const head = document.createElement('div');
    head.className = 'flex qhead';

    const typeTag = document.createElement('span');
    typeTag.className = 'tag' + (q.isJudge ? ' judge' : q.isMultiple ? ' multi' : '');
    typeTag.textContent = q.isJudge ? '判断题' : q.isMultiple ? '多选题' : '单选题';

    const idTag = document.createElement('span');
    idTag.className = 'tag';
    idTag.textContent = q.code || '第 ' + (idx + 1) + ' 题';

    head.append(typeTag, idTag);

    if (q.knowledge) {
      const k = document.createElement('span');
      k.className = 'small';
      k.textContent = '知识点：' + q.knowledge;
      head.appendChild(k);
    }

    const titleId = 'qt-' + idx;
    const title = document.createElement('div');
    title.className = 'question-title';
    title.id = titleId;
    title.textContent = q.title;

    const box = document.createElement('div');
    box.className = 'options';
    box.setAttribute('role', q.isMultiple ? 'group' : 'radiogroup');
    box.setAttribute('aria-labelledby', titleId);

    const feedback = document.createElement('div');
    feedback.className = 'qfeedback';

    const item = { q, idx, optionEls: [], feedback };
    const ans = state.answers[q.id] || [];

    q.options.forEach((opt, i) => {
      const label = document.createElement('label');
      label.className = 'option';

      const input = document.createElement('input');
      input.type = q.isMultiple ? 'checkbox' : 'radio';
      input.name = 'answer-' + idx;
      input.value = String(i);
      input.checked = ans.indexOf(i) >= 0;
      input.disabled = state.submitted;
      input.addEventListener('change', () => onPick(item, i, input.checked));

      const txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = LETTER(i) + '．' + opt;

      const mark = document.createElement('span');
      mark.className = 'mark';

      label.append(input, txt, mark);
      box.appendChild(label);
      item.optionEls.push({ label, mark });
    });

    art.append(head, title, box, feedback);
    paintOptions(item, ans);
    paintFeedback(item);
    return art;
  }

  function paintOptions(item, ans) {
    item.optionEls.forEach((o, i) => {
      const sel = ans.indexOf(i) >= 0;
      const right = item.q.right.indexOf(i) >= 0;
      o.label.classList.toggle('selected', sel);
      o.label.classList.remove('correct', 'wrong');
      o.mark.className = 'mark';
      o.mark.textContent = '';
      if (!state.submitted) return;
      if (right) {
        o.label.classList.add('correct');
        o.mark.classList.add('ok');
        o.mark.textContent = '✓';
      } else if (sel) {
        o.label.classList.add('wrong');
        o.mark.classList.add('bad');
        o.mark.textContent = '✗';
      }
    });
  }

  function paintFeedback(item) {
    const fb = item.feedback;
    fb.innerHTML = '';
    if (!state.submitted) return;
    const st = statusOf(item.q);
    const line = document.createElement('div');
    line.className = 'verdict ' + (st === 1 ? 'ok' : st === -1 ? 'bad' : '');
    line.textContent = st === 1 ? '回答正确' : st === -1 ? '回答错误' : '未作答';
    const key = document.createElement('div');
    key.className = 'small';
    key.textContent = '正确答案：' + item.q.right.map(LETTER).join('、');
    fb.append(line, key);
  }

  function renderPage() {
    const list = $('questionList');
    list.innerHTML = '';
    const len = state.questions.length;
    if (!len) {
      const p = document.createElement('p');
      p.className = 'small';
      p.textContent = '当前没有可显示的题目，请先加载题库。';
      list.appendChild(p);
      return;
    }
    const start = state.page * state.pageSize;
    const end = Math.min(start + state.pageSize, len);
    for (let i = start; i < end; i++) list.appendChild(buildQuestion(state.questions[i], i));
  }

  function updateStats() {
    const list = state.questions;
    const total = list.length;
    let answered = 0, correct = 0, wrong = 0;
    for (let i = 0; i < total; i++) {
      const st = statusOf(list[i]);
      if (st === 0) continue;
      answered++;
      if (st === 1) correct++; else wrong++;
    }
    $('totalCount').textContent = total;
    $('answeredCount').textContent = answered;
    $('correctCount').textContent = correct;
    $('wrongCount').textContent = wrong;
    $('accuracy').textContent = answered ? Math.round(correct / answered * 100) + '%' : '0%';

    if (total) {
      const start = state.page * state.pageSize + 1;
      const end = Math.min((state.page + 1) * state.pageSize, total);
      $('progressText').textContent = '第 ' + (state.page + 1) + '/' + pageCount() +
        ' 页（第 ' + start + '-' + end + ' 题）';
    } else {
      $('progressText').textContent = '';
    }

    const pct = total ? Math.round(answered / total * 100) : 0;
    $('progressBar').style.width = pct + '%';
    $('progressWrap').setAttribute('aria-valuenow', String(pct));
    $('progressWrap').setAttribute('aria-valuetext', '已答 ' + answered + ' / ' + total + ' 题');
  }

  function updatePagers() {
    const pc = pageCount();
    const nodes = document.querySelectorAll('.pager');
    for (let i = 0; i < nodes.length; i++) {
      const prev = nodes[i].querySelector('[data-nav="prev"]');
      const next = nodes[i].querySelector('[data-nav="next"]');
      const info = nodes[i].querySelector('.pager-info');
      if (!prev || !next || !info) continue;
      prev.disabled = state.page <= 0;
      next.disabled = state.page >= pc - 1;
      info.textContent = '第 ' + (state.page + 1) + ' / ' + pc + ' 页';
    }
  }

  function goPage(delta) {
    const target = Math.min(Math.max(state.page + delta, 0), pageCount() - 1);
    if (target === state.page) return;
    state.page = target;
    syncCardPage();
    renderPage();
    updateStats();
    updatePagers();
    const list = $('questionList');
    if (list) list.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ========================= 答题卡 ========================= */
  function syncCardPage() {
    const target = Math.floor((state.page * state.pageSize) / CARD_SIZE);
    const clamped = Math.min(Math.max(target, 0), cardPageCount() - 1);
    if (clamped !== state.cardPage) {
      state.cardPage = clamped;
      renderCardPage();
    }
  }

  function renderCardPage() {
    const box = $('answerCard');
    box.innerHTML = '';
    state.cardEls = [];
    const len = state.questions.length;
    if (len) {
      const start = state.cardPage * CARD_SIZE;
      const end = Math.min(start + CARD_SIZE, len);
      const frag = document.createDocumentFragment();
      for (let i = start; i < end; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = String(i + 1);
        btn.title = '跳到第 ' + (i + 1) + ' 题';
        btn.addEventListener('click', () => jumpTo(i));
        frag.appendChild(btn);
        state.cardEls.push(btn);
      }
      box.appendChild(frag);
    }
    paintCardPage();
    updateCardPager();
  }

  function paintCardPage() {
    const base = state.cardPage * CARD_SIZE;
    for (let k = 0; k < state.cardEls.length; k++) paintCardButton(base + k);
  }

  function paintCardButton(idx) {
    const btn = state.cardEls[idx - state.cardPage * CARD_SIZE];
    const q = state.questions[idx];
    if (!btn || !q) return;
    const st = statusOf(q);
    const cls = [];
    if (st !== 0) cls.push('answered');
    if (state.submitted && st === 1) cls.push('correct');
    if (state.submitted && st === -1) cls.push('wrong');
    btn.className = cls.join(' ');
  }

  function updateCardPager() {
    const total = state.questions.length;
    const start = state.cardPage * CARD_SIZE + 1;
    const end = Math.min((state.cardPage + 1) * CARD_SIZE, total);
    $('cardRange').textContent = total ? '第 ' + start + '-' + end + ' 题 / 共 ' + total + ' 题' : '';
    $('cardPrev').disabled = state.cardPage <= 0;
    $('cardNext').disabled = state.cardPage >= cardPageCount() - 1;
  }

  function goCardPage(delta) {
    const target = Math.min(Math.max(state.cardPage + delta, 0), cardPageCount() - 1);
    if (target === state.cardPage) return;
    state.cardPage = target;
    renderCardPage();
  }

  function jumpTo(idx) {
    const target = Math.floor(idx / state.pageSize);
    if (target !== state.page) {
      state.page = target;
      renderPage();
      updateStats();
      updatePagers();
    }
    const el = document.querySelector('.qcard[data-idx="' + idx + '"]');
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1500);
    }
  }

  /* ========================= 整体刷新 ========================= */
  function updateAll() {
    renderPage();
    updateStats();
    updatePagers();
    renderCardPage();
  }

  /* ========================= 交互 ========================= */
  function onPick(item, i, checked) {
    if (state.submitted) return;
    const q = item.q;
    let ans = (state.answers[q.id] || []).slice();
    if (q.isMultiple) {
      if (checked) { if (ans.indexOf(i) < 0) ans.push(i); }
      else ans = ans.filter(x => x !== i);
      ans.sort((a, b) => a - b);
    } else {
      ans = [i];
    }
    if (ans.length) {
      state.answers[q.id] = ans;
      state.keys[q.id] = keyOf(ans);
    } else {
      delete state.answers[q.id];
      delete state.keys[q.id];
    }
    saveAnswers();
    paintOptions(item, state.answers[q.id] || []);
    paintFeedback(item);
    updateStats();
    paintCardButton(item.idx);
  }

  function startQuiz() {
    if (!state.all.length) {
      setStatus('题库还没有加载成功，请先点右上角“重新加载题库”。', true);
      return;
    }
    const mode = $('modeSelect').value;
    let arr = state.all.slice();

    if (mode === 'random') shuffle(arr);
    else if (mode === 'wrong') arr = arr.filter(q => statusOf(q) === -1);
    else if (mode === 'unanswered') arr = arr.filter(q => statusOf(q) === 0);

    if (!arr.length) {
      setStatus(mode === 'wrong' ? '目前没有已答错的题目，先完整练一遍再来复习吧。' : '当前模式下没有题目。', false);
      return;
    }

    state.questions = arr;
    state.page = 0;
    state.cardPage = 0;
    state.submitted = false;
    $('resultPanel').hidden = true;
    $('cardPanel').hidden = true;
    updateCardToggle();
    updateAll();
  }

  function submitQuiz() {
    if (!state.questions.length) return;
    state.submitted = true;
    renderPage();
    paintCardPage();
    showResult();
  }

  function showResult() {
    const total = state.questions.length;
    let answered = 0, correct = 0;
    state.questions.forEach(q => {
      const st = statusOf(q);
      if (st !== 0) answered++;
      if (st === 1) correct++;
    });
    const wrong = answered - correct;
    const score = total ? Math.round(correct / total * 100) : 0;
    const acc = answered ? Math.round(correct / answered * 100) : 0;
    $('resultBox').textContent =
      '本次练习共 ' + total + ' 题：已答 ' + answered + ' 题（正确 ' + correct +
      '，错误 ' + wrong + '），未答 ' + (total - answered) + ' 题。' +
      '按全部题目计算得分率 ' + score + '%，按已答题计算正确率 ' + acc + '%。';
    const panel = $('resultPanel');
    panel.hidden = false;
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function resetAnswers() {
    const ok = await askConfirm('确定清空本机保存的全部答题记录？此操作不可撤销。');
    if (!ok) return;
    state.answers = {};
    state.keys = {};
    state.submitted = false;
    legacyAnswers = null;
    $('resultPanel').hidden = true;
    saveAnswers();
    updateAll();
  }

  function toggleCard() {
    const panel = $('cardPanel');
    panel.hidden = !panel.hidden;
    updateCardToggle();
    if (!panel.hidden) {
      syncCardPage();
      renderCardPage();
    }
  }

  function updateCardToggle() {
    const btn = $('toggleCardBtn');
    const panel = $('cardPanel');
    if (btn && panel) btn.setAttribute('aria-expanded', String(!panel.hidden));
  }

  function onPageSizeChange() {
    const size = Number($('pageSizeSelect').value) || 10;
    const first = state.page * state.pageSize;
    state.pageSize = size;
    state.page = Math.min(Math.floor(first / size), pageCount() - 1);
    renderPage();
    updateStats();
    updatePagers();
    syncCardPage();
  }

  function onKeyDown(e) {
    const tag = ((e.target && e.target.tagName) || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      goPage(-1);
    } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
      e.preventDefault();
      goPage(1);
    } else if (e.key === 'Enter' && tag !== 'button' && !state.submitted) {
      submitQuiz();
    }
  }

  /* ========================= 导出 ========================= */
  function csvCell(v) {
    let s = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;   // 防 Excel 公式注入
    return '"' + s.replace(/"/g, '""') + '"';
  }

  function exportWrongCsv() {
    const wrong = state.questions.filter(q => statusOf(q) === -1);
    if (!wrong.length) {
      setStatus('当前练习没有已答错的题目，先做几道题再来导出吧。', true);
      return;
    }
    const rows = [['题号', '题型', '题干', '你的答案', '正确答案', '知识点', '来源']];
    wrong.forEach(q => {
      rows.push([
        q.code || q.loc,
        q.isJudge ? '判断题' : q.isMultiple ? '多选题' : '单选题',
        q.title,
        (state.answers[q.id] || []).map(LETTER).join('、'),
        q.right.map(LETTER).join('、'),
        q.knowledge || '',
        q.loc
      ]);
    });
    const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '汽车专业错题_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ========================= 对话框 ========================= */
  function askConfirm(text) {
    const dlg = $('confirmDlg');
    if (!dlg || typeof dlg.showModal !== 'function') {
      return Promise.resolve(window.confirm(text));
    }
    $('confirmText').textContent = text;
    return new Promise(resolve => {
      if (dlg.open) dlg.close('cancel');
      dlg.returnValue = 'cancel';
      const done = () => {
        dlg.removeEventListener('close', done);
        resolve(dlg.returnValue === 'ok');
      };
      dlg.addEventListener('close', done);
      dlg.showModal();
    });
  }

  /* ========================= 题库加载 ========================= */
  function setStatus(msg, isError) {
    const el = $('loadInfo');
    el.textContent = msg;
    el.classList.toggle('error', !!isError);
  }

  function loadScript(src, timeout) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      const timer = setTimeout(() => { cleanup(); reject(new Error('加载超时')); }, timeout || 10000);
      function cleanup() {
        clearTimeout(timer);
        s.onload = null;
        s.onerror = null;
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      s.onload = () => { cleanup(); resolve(); };
      s.onerror = () => { cleanup(); reject(new Error('加载失败')); };
      document.head.appendChild(s);
    });
  }

  function ensureXLSX() {
    if (window.XLSX) return Promise.resolve();
    if (xlsxPromise) return xlsxPromise;
    xlsxPromise = (async () => {
      for (const src of XLSX_SOURCES) {
        try {
          await loadScript(src);
          if (window.XLSX) return;
        } catch (e) {
          console.warn('Excel 解析库加载失败，尝试下一个来源：', src, e);
        }
      }
      throw new Error('Excel 解析库加载失败：请检查网络，或把 xlsx.full.min.js 放到仓库根目录后重试。');
    })();
    xlsxPromise.catch(() => { xlsxPromise = null; });
    return xlsxPromise;
  }

  function fetchWithTimeout(url, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms || 30000);
    return fetch(url, { signal: ctrl.signal, cache: 'no-cache' })
      .finally(() => clearTimeout(timer));
  }

  async function fetchBank() {
    let lastErr = null;
    for (const url of BANK_URLS) {
      try {
        const res = await fetchWithTimeout(url, 30000);
        if (!res.ok) {
          lastErr = new Error('无法读取 ' + url + '（HTTP ' + res.status + '）');
          continue;
        }
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        if (ct.indexOf('text/html') >= 0) {
          lastErr = new Error(url + ' 返回的是网页而不是 Excel 文件');
          continue;
        }
        const buf = await res.arrayBuffer();
        if (!buf.byteLength) {
          lastErr = new Error(url + ' 是空文件（0 字节）');
          continue;
        }
        return { buf, url };
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('题库下载失败');
  }

  async function loadBank() {
    const btn = $('reloadBankBtn');
    btn.disabled = true;
    setStatus('正在加载题库……');

    try {
      await ensureXLSX();
      const { buf, url } = await fetchBank();

      let wb;
      try {
        wb = XLSX.read(buf, { type: 'array' });
      } catch (e) {
        throw new Error('Excel 解析失败：请确认为 .xls 或 .xlsx 格式且未加密。');
      }

      const parsed = parseWorkbook(wb);
      const questions = parsed.questions;
      if (!questions.length) {
        throw new Error('文件已下载，但没有解析到有效题目' + statsSummary(parsed.stats) +
          '。请检查表头、选项列和答案列。');
      }

      state.all = questions;
      migrateLegacy(questions);
      state.questions = questions.slice();
      state.pageSize = Number($('pageSizeSelect').value) || 10;
      state.page = 0;
      state.cardPage = 0;
      state.submitted = false;
      revalidateAnswers();

      $('quizPanel').hidden = false;
      $('resultPanel').hidden = true;
      $('cardPanel').hidden = true;
      updateCardToggle();
      updateAll();
      saveAnswers();

      try { localStorage.removeItem(LEGACY_KEY); } catch (e) { /* 忽略 */ }
      legacyAnswers = null;

      setStatus('题库加载成功：' + url + ' 共 ' + questions.length + ' 道题，来自 ' +
        wb.SheetNames.length + ' 个工作表（' + wb.SheetNames.join('、') + '）' +
        statsSummary(parsed.stats) + '。', false);
    } catch (err) {
      console.error(err);
      setStatus('题库加载失败：' + (err && err.message ? err.message : String(err)), true);
    } finally {
      btn.disabled = false;
    }
  }

  /* ========================= 事件绑定与启动 ========================= */
  function bindEvents() {
    on('reloadBankBtn', loadBank);
    on('startBtn', startQuiz);
    on('submitBtn', submitQuiz);
    on('resetBtn', resetAnswers);
    on('toggleCardBtn', toggleCard);
    on('reviewWrongBtn', () => { $('modeSelect').value = 'wrong'; startQuiz(); });
    on('exportWrongBtn', exportWrongCsv);
    on('cardPrev', () => goCardPage(-1));
    on('cardNext', () => goCardPage(1));

    const navBtns = document.querySelectorAll('.pager [data-nav]');
    for (let i = 0; i < navBtns.length; i++) {
      navBtns[i].addEventListener('click', () => {
        goPage(navBtns[i].getAttribute('data-nav') === 'prev' ? -1 : 1);
      });
    }

    const size = $('pageSizeSelect');
    if (size) size.addEventListener('change', onPageSizeChange);
    document.addEventListener('keydown', onKeyDown);
  }

  loadSaved();
  bindEvents();
  loadBank();
})();
</script>
</body>
</html>
